[project]
name = "whittle"
version = "0.1.0"
description = "CFD AI Assistant"
requires-python = ">=3.8"
authors = [
    {name = "Kade"}
]
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "python-multipart>=0.0.5",
    "markdown2>=2.4.0",
    "python-dotenv>=0.19.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "openai>=1.12.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
whittle = "whittle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.ruff]
line-length = 100 