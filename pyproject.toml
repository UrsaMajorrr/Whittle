[project]
name = "whittle"
version = "0.1.0"
description = "AI-powered assistant for CFD case setup and mesh generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich",
    "openai",
    "anthropic",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["whittle*"]
